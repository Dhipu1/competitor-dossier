name: Deploy site to GitHub Pages

# site/index.html has no document skeleton of its own — the Artifact host
# supplies one. GitHub Pages doesn't, so the standalone copy is built here at
# deploy time rather than committed, keeping one source of truth.

on:
  push:
    branches: [master]
    paths:
      - "site/index.html"
      - "scripts/build_local_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the standalone page
        run: |
          python scripts/build_local_site.py
          mkdir -p _site
          cp site/standalone.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
